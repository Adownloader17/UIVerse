<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend User Feedback - UIVerse</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>UIVerse Feedback</h1>
            <p>Help us improve by sharing your thoughts</p>
        </header>

        <form id="feedbackForm" class="feedback-form">
            <div class="form-group">
                <label for="name">Name *</label>
                <input type="text" id="name" name="name" required placeholder="Your name">
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required placeholder="your.email@example.com">
            </div>

            <div class="form-group">
                <label for="category">Feedback Category *</label>
                <select id="category" name="category" required>
                    <option value="">Select a category</option>
                    <option value="general">General Feedback</option>
                    <option value="content">Content Suggestions</option>
                    <option value="tools">AI Tools Request</option>
                    <option value="bug">Bug Report</option>
                    <option value="feature">Feature Request</option>
                </select>
            </div>

            <div class="form-group">
                <label for="experience">How would you rate your experience? *</label>
                <div class="rating">
                    <input type="radio" id="star5" name="rating" value="5" required>
                    <label for="star5">⭐⭐⭐⭐⭐</label>
                    
                    <input type="radio" id="star4" name="rating" value="4">
                    <label for="star4">⭐⭐⭐⭐</label>
                    
                    <input type="radio" id="star3" name="rating" value="3">
                    <label for="star3">⭐⭐⭐</label>
                    
                    <input type="radio" id="star2" name="rating" value="2">
                    <label for="star2">⭐⭐</label>
                    
                    <input type="radio" id="star1" name="rating" value="1">
                    <label for="star1">⭐</label>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Your Feedback *</label>
                <textarea id="message" name="message" rows="6" required placeholder="Share your thoughts, suggestions, or report issues..."></textarea>
            </div>

            <div class="form-group checkbox-group">
                <input type="checkbox" id="subscribe" name="subscribe">
                <label for="subscribe">Subscribe to updates about new frontend resources</label>
            </div>

            <button type="submit" class="submit-btn">Submit Feedback</button>
        </form>

        <div id="successMessage" class="success-message" style="display: none;">
            <p>✅ Thank you for your feedback! We appreciate your input.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
